name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release, e.g. v1.2.0. Leave empty to derive it from the commits since the last tag."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  MARKER: "<!-- generated-notes-below -->"

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$(pnpm exec git-cliff --bumped-version 2>/dev/null)}"
          case "$version" in v*) ;; *) version="v$version" ;; esac
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::Tag $version already exists"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing as $version"

      - name: Pin the compose file to the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Image tags carry no "v" prefix (metadata-action semver pattern)
          sed -i -E "s#(image: ghcr.io/ollioddi/crowdsec-local-dashboard:).*#\1${VERSION#v}#" docker-compose.yml
          if git diff --quiet -- docker-compose.yml; then
            echo "docker-compose.yml already pins $VERSION"; exit 0
          fi

          branch="release/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore(release): pin compose to $VERSION"
          git push --force origin "$branch"

          # A PR opened with the workflow token never gets a CI run, so the
          # required check leaves it unmergeable and auto-merge waits forever.
          # RELEASE_TOKEN is a fine-grained PAT whose PRs run CI like any other.
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "::warning::RELEASE_TOKEN is not set. The prep PR will get no CI run and cannot auto-merge; merge it by hand."
          fi
          export GH_TOKEN="${RELEASE_TOKEN:-$GH_TOKEN}"
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "chore(release): pin compose to $VERSION" \
              --body "Merge before publishing the $VERSION draft so the tagged compose file pulls its own image."
          fi
          gh pr merge "$branch" --auto --squash \
            || echo "::warning::Auto-merge is not enabled; merge the prep PR by hand before publishing."
          git checkout -q "$GITHUB_SHA"

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          # git-cliff looks up the pull request behind each commit with this
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Drop git-cliff's own version heading; the release title carries it
          pnpm exec git-cliff --unreleased --tag "$VERSION" --strip all 2>/dev/null \
            | awk 'NR==1 && /^## /{next} NR==2 && /^$/{next} {print}' > generated.md

          # Text above the marker comes from the existing draft (keeps edits) or the template
          if ! gh release view "$VERSION" --json body -q .body > source.md 2>/dev/null \
             || ! grep -qF "$MARKER" source.md; then
            cp .github/release-notes-template.md source.md
          fi
          awk -v m="$MARKER" '$0==m{exit} {print}' source.md > above.md

          { cat above.md; echo "$MARKER"; echo "## Changes"; echo; cat generated.md; } > notes.md
          cat notes.md

      - name: Create or update the draft
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac

          if gh release view "$VERSION" --json isDraft -q .isDraft > is_draft.txt 2>/dev/null; then
            if [ "$(cat is_draft.txt)" != "true" ]; then
              echo "::error::$VERSION is already published"; exit 1
            fi
            gh release edit "$VERSION" --draft --target main --title "$VERSION" \
              --notes-file notes.md "${prerelease[@]}"
            action="Updated"
          else
            gh release create "$VERSION" --draft --target main --title "$VERSION" \
              --notes-file notes.md "${prerelease[@]}"
            action="Created"
          fi

          url="$(gh release view "$VERSION" --json url -q .url)"
          {
            echo "### $action draft release $VERSION"
            echo
            echo "Merge the prep PR, edit the summary above the marker, then publish: $url"
          } >> "$GITHUB_STEP_SUMMARY"
