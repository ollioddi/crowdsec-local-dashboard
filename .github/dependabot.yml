version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # One PR per week for everything that should be safe to merge on green CI
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Waiting for the data table rewrite before moving to TanStack Table 9
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      # Must match the Node version in the Dockerfile
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
