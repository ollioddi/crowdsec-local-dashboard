# docs-site/ is deliberately NOT a workspace member. It has its own lockfile
# and workspace root, so `pnpm install` here, CI and the Docker build never
# resolve Astro. Use `pnpm docs:dev` / `pnpm docs:build` to drive it.

allowBuilds:
  better-sqlite3: true
  esbuild: true
  '@prisma/engines': false
  prisma: false
  prisma-zod-generator: false
minimumReleaseAgeExclude:
  - git-cliff-darwin-arm64@2.14.2
  - git-cliff-darwin-x64@2.14.2
  - git-cliff-linux-arm64@2.14.2
  - git-cliff-linux-x64@2.14.2
  - git-cliff-windows-arm64@2.14.2
  - git-cliff-windows-x64@2.14.2
  - git-cliff@2.14.2

# Transitive packages with published advisories that their parents have not bumped yet
overrides:
  ip-address: '>=10.3.1'
  mysql2: '>=3.23.1'
  deepmerge-ts: '>=8.0.0'
